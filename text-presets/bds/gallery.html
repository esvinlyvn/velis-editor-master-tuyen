<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Preset chữ BĐS · Vis giữ xe</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/be-vietnam-pro/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/be-vietnam-pro/900.css">
<link rel="stylesheet" href="bds-presets.css">
<style>
  :root { --bg1: #0c2f5c; --bg2: #02070f; --frame: #1f6fd1; }
  html, body { margin: 0; background: #000; }
  #page { width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg1) 0%, #061a33 45%, var(--bg2) 100%);
    font-family: "Be Vietnam Pro", sans-serif; }
  h1 { margin: 0; position: absolute; top: 70px; width: 100%; text-align: center; font-weight: 900; font-size: 100px; line-height: 1.3; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #2d8cff, #7fd3ff 60%, #2d8cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 0; position: absolute; top: 205px; width: 100%; text-align: center; color: #fff; font-weight: 700; font-size: 58px; line-height: 1.35; }
  #grid { position: absolute; top: 345px; left: 80px; right: 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 22px; }
  .tile { border-radius: 30px; padding: 12px 14px 14px; background: linear-gradient(160deg, #1b4f8f 0%, #0b2547 55%, #123f7a 100%);
    box-shadow: inset 0 0 0 2px #2b7be055, 0 10px 30px #0008; }
  .tile .lb { color: #e8f1ff; font-weight: 700; font-size: 25px; line-height: 1.4; padding: 0 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .bx { position: relative; height: 150px; border-radius: 22px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: inset 0 0 0 1px #ffffff10; }
</style>
</head>
<body>
<div id="page">
  <h1>PRESET CHỮ BĐS</h1>
  <h2>bộ chữ chốt riêng cho Vis giữ xe</h2>
  <div id="grid"></div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="bds-presets.js"></script>
<script>
  const SIZE = { "go-chu": 34, "quay-vong": 40, "ky-thuat": 40, "chuyen-dong": 44, "gia-chot": 54 };
  const tls = [];
  async function main() {
    await document.fonts.ready;
    const grid = document.getElementById("grid");
    for (const key of BDS.list()) {
      const p = BDS.presets[key];
      const tile = document.createElement("div"); tile.className = "tile";
      tile.innerHTML = `<div class="lb">${p.vi}</div><div class="bx"></div>`;
      grid.appendChild(tile);
      const bx = tile.querySelector(".bx");
      const h = BDS.make(key, bx, { size: SIZE[key] || 50, ...p.sample });
      const maxW = bx.clientWidth * 0.82;
      if (h.r.offsetWidth > maxW) h.r.style.fontSize = (parseFloat(getComputedStyle(h.r).fontSize) * maxW / h.r.offsetWidth) + "px";
      const tl = gsap.timeline({ paused: true, repeat: -1, repeatDelay: 0.25 });
      const end = BDS.in(tl, h, 0.15);
      BDS.out(tl, h, Math.max(end + 1.3, 2.6));
      tls.push(tl);
    }
    window.__ready = true;
    if (!/[?&]static/.test(location.search)) tls.forEach((t) => t.play());
  }
  window.__seek = (t) => tls.forEach((tl) => tl.totalTime(t));
  main();
</script>
</body>
</html>
